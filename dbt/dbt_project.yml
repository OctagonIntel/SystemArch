name: governed_dwh
version: "1.0.0"
config-version: 2
profile: governed_dwh

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  governed_dwh:
    staging:
      +schema: staging
      +materialized: view
    # Rebuilds drop grants and RLS, the post-hook restores them (ADR-014)
    marts:
      +schema: marts
      +materialized: table
      +post-hook: "select governance.apply_access('{{ this }}'::regclass)"
    marts_restricted:
      +schema: marts_restricted
      +materialized: table
      +post-hook: "select governance.apply_access('{{ this }}'::regclass)"
