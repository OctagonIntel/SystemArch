# No secrets in here. Everything comes from .env (just loads it) or CI environment variables.
# dbt always runs as svc_transform, never as admin.
governed_dwh:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME', 'postgres') }}"
      user: "{{ ('svc_transform.' ~ env_var('SUPABASE_PROJECT_REF')) if env_var('SUPABASE_PROJECT_REF', '') else 'svc_transform' }}"
      password: "{{ env_var('SVC_TRANSFORM_PASSWORD') }}"
      schema: staging
      threads: 2
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
