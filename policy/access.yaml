# Who can do what in the warehouse. The only place access is defined.
# `just plan` shows the SQL, `just apply-policy` applies it. People are in people.yaml.

version: 1

# Owns the schemas, raw and governance. Can't log in.
owner: wh_owner

# built_by: dbt builds these as that account. Access is re-applied after each build (ADR-014).
schemas:
  raw: Landing zone. Ingest accounts write, nobody reads.
  staging: Cleaned by dbt. Only svc_transform.
  marts:
    description: Business tables. Personal data hashed (ADR-005).
    built_by: svc_transform
  marts_restricted:
    description: Clear-text personal data. Columns by clearance.
    built_by: svc_transform
  governance: Policy rules as tables, plus the functions that apply them.
  audit: Query and access logs. Auditor only, append-only.

# ADR-013. Lowest first. Every column of a table with personal data is listed,
# public ones too, and a test fails if one is missing.
classification:
  levels: [public, internal, confidential, restricted]
  columns:
    dim_employee:
      employee_id: public
      full_name: internal
      email: internal
      phone: confidential
      date_of_birth: restricted
      national_id: restricted
      department: public
      job_title: public
      region: public
      country: public
      hire_date: public
      salary_eur: confidential
      manager_id: public
    dim_customer:
      customer_id: public
      company_name: public
      contact_name: internal
      contact_email: internal
      contact_phone: confidential
      region: public
      country: public
      account_owner_id: public
      created_at: public
    fct_tickets:
      ticket_id: public
      customer_id: public
      region: public
      contact_email: internal
      subject: public
      priority: public
      status: public
      opened_at: public
      closed_at: public
      resolution_hours: public
      agent_id: public

# Supabase roles that hold pg_read_all_data, so they can read every table.
# Not ours to remove, so they're listed: a new one fails the separation-of-duties tests.
platform_readers: [supabase_read_only_user, supabase_etl_admin]

# ADR-006. Region RLS. Readers must declare `regions`.
row_filters:
  marts.dim_customer: region
  marts.fct_deals: region
  marts.fct_invoices: region
  marts.fct_tickets: region
  marts_restricted.dim_customer: region
  marts_restricted.fct_tickets: region

roles:
  # Service accounts, one per job (ADR-012)

  svc_ingest_hr:
    type: service
    purpose: Loads the HR export into raw
    schemas:
      raw: [USAGE]
    tables:
      raw.hr_employees: [INSERT]

  svc_ingest_crm:
    type: service
    purpose: Loads the CRM export into raw
    schemas:
      raw: [USAGE]
    tables:
      raw.crm_customers: [INSERT]
      raw.crm_deals: [INSERT]

  svc_ingest_support:
    type: service
    purpose: Loads the support export into raw
    schemas:
      raw: [USAGE]
    tables:
      raw.support_tickets: [INSERT]

  svc_ingest_finance:
    type: service
    purpose: Loads the finance export into raw
    schemas:
      raw: [USAGE]
    tables:
      raw.finance_invoices: [INSERT]

  svc_transform:
    type: service
    purpose: Runs dbt and re-applies access after each build
    schemas:
      raw: [USAGE]
      staging: [USAGE, CREATE]
      marts: [USAGE, CREATE]
      marts_restricted: [USAGE, CREATE]
      governance: [USAGE]
    tables:
      raw.*: [SELECT]
      governance.table_access: [SELECT]
      governance.column_classification: [SELECT]
      governance.row_filters: [SELECT]
    functions:
      governance.pii_hash: [EXECUTE]
      governance.apply_access: [EXECUTE]

  # Groups. No login, people join them in people.yaml (ADR-007)

  analyst:
    type: human
    purpose: Company-wide reporting on hashed data
    regions: all
    schemas:
      marts: [USAGE]
    tables:
      marts.*: [SELECT]

  hr:
    type: human
    purpose: Full employee records
    schemas:
      marts: [USAGE]
      marts_restricted: [USAGE]
    tables:
      marts.dim_employee: [SELECT]
      marts.agg_salary_by_department: [SELECT]
      marts_restricted.dim_employee: {privileges: [SELECT], clearance: restricted}

  finance:
    type: human
    purpose: Invoices, deals and salaries. No IDs or birth dates
    regions: all
    schemas:
      marts: [USAGE]
      marts_restricted: [USAGE]
    tables:
      marts.fct_invoices: [SELECT]
      marts.fct_deals: [SELECT]
      marts.dim_customer: [SELECT]
      marts.agg_salary_by_department: [SELECT]
      marts_restricted.dim_employee: {privileges: [SELECT], clearance: confidential}

  payroll:
    type: human
    purpose: Runs payroll. Needs national ID and birth date for tax filings
    schemas:
      marts: [USAGE]
      marts_restricted: [USAGE]
    tables:
      marts.agg_salary_by_department: [SELECT]
      marts_restricted.dim_employee: {privileges: [SELECT], clearance: restricted}

  sales_eu:
    type: human
    purpose: EU customers and deals only
    regions: [EU]
    schemas: &sales_schemas
      marts: [USAGE]
      marts_restricted: [USAGE]
    tables: &sales_tables
      marts.dim_customer: [SELECT]
      marts.fct_deals: [SELECT]
      marts_restricted.dim_customer: {privileges: [SELECT], clearance: confidential}

  sales_us:
    type: human
    purpose: US customers and deals only
    regions: [US]
    schemas: *sales_schemas
    tables: *sales_tables

  sales_apac:
    type: human
    purpose: APAC customers and deals only
    regions: [APAC]
    schemas: *sales_schemas
    tables: *sales_tables

  support:
    type: human
    purpose: Tickets and customer contacts, no money
    regions: all
    schemas:
      marts: [USAGE]
      marts_restricted: [USAGE]
    tables:
      marts.fct_tickets: [SELECT]
      marts.dim_customer: [SELECT]
      marts_restricted.fct_tickets: {privileges: [SELECT], clearance: internal}
      marts_restricted.dim_employee: {privileges: [SELECT], clearance: confidential}
      marts_restricted.dim_customer: {privileges: [SELECT], clearance: confidential}

  auditor:
    type: human
    purpose: Access and query logs, never business data (Phase 4)
    schemas:
      audit: [USAGE]
